<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cấp quyền micro — AI Meeting Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f1f3f4; color: #202124;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff; border-radius: 14px; max-width: 460px; width: 100%;
      padding: 28px 28px 24px; box-shadow: 0 1px 3px rgba(60,64,67,.15), 0 4px 16px rgba(60,64,67,.08);
    }
    .icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
    }
    .icon svg { width: 26px; height: 26px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.55; color: #3c4043; margin-bottom: 12px; }
    .muted { font-size: 12.5px; color: #5f6368; }
    button {
      font: inherit; font-size: 14px; font-weight: 600;
      border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer;
    }
    .primary { background: #1a73e8; color: #fff; }
    .primary:hover { background: #1557b0; }
    .primary:disabled { background: #9aa0a6; cursor: default; }
    .ghost { background: transparent; color: #1a73e8; }
    .ghost:hover { background: #e8f0fe; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .status { font-size: 13.5px; border-radius: 8px; padding: 10px 12px; margin-top: 14px; display: none; line-height: 1.5; }
    .status.ok  { display: block; background: #e6f4ea; color: #137333; }
    .status.err { display: block; background: #fce8e6; color: #a50e0e; }
    code { background: #f1f3f4; border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="2" width="4" height="7.5" rx="2"/><path d="M3.5 7.8a4.5 4.5 0 0 0 9 0"/>
        <line x1="8" y1="12.3" x2="8" y2="14"/><line x1="5.5" y1="14" x2="10.5" y2="14"/>
      </svg>
    </div>
    <h1>Cho phép dùng micro khi ghi hình</h1>
    <p>Khi ghi tab cuộc họp, tiếng của tab chỉ có giọng những người khác. Để bản ghi có cả giọng của bạn, extension cần quyền dùng micro.</p>
    <p class="muted">Chỉ cần cấp <b>một lần</b>. Micro chỉ được dùng trong lúc bạn đang ghi hình, và bản ghi chỉ lưu trên máy này.</p>

    <div class="actions">
      <button class="primary" id="grantBtn">Cấp quyền micro</button>
      <button class="ghost" id="backBtn" style="display:none">Quay lại tab cuộc họp</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
